      // Обновление страницы при возвращении из спящего режима (с задержкой)
      (function handlePageVisibility() {
        let hiddenTime = null;
        const RELOAD_THRESHOLD = 30 * 60 * 1000; // 30 минут

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            hiddenTime = Date.now();
          } else if (hiddenTime) {
            const timeHidden = Date.now() - hiddenTime;
            if (timeHidden >= RELOAD_THRESHOLD) {
              window.location.reload();
            }
            hiddenTime = null;
          }
        });
      })();
